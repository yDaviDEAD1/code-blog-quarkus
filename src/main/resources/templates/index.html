<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{title}</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="toast-container"></div>

<div id="confirmation-modal" class="modal-overlay" style="display: none;">
  <div class="modal-content">
    <h3>Confirmação de Exclusão</h3>
    <p>Tem certeza que deseja excluir esta notícia?</p>
    <div class="modal-actions">
      <button id="cancel-delete" class="modal-btn modal-cancel">Cancelar</button>
      <button id="confirm-delete" class="modal-btn modal-delete">Excluir Permanentemente</button>
    </div>
  </div>
</div>

<header>
  <h1>Meu Blog Básico em Quarkus</h1>
  <div id="auth-button-container">
  </div>
</header>

<main>

  <section id="auth-status-section" class="fade-in">
    <div id="logged-in-view" style="display: none;">
      <p>Bem-vindo(a), <strong id="username-display"></strong> <span class="role-tag" id="role-display"></span></p>
    </div>
  </section>

  <section id="post-creation-section" style="display: none;">
    <h2>Nova Notícia</h2>
    <form id="postForm" class="smooth-card">
      <input type="text" id="post-title" placeholder="Título da Notícia" required>
      <textarea id="post-content" placeholder="Conteúdo da notícia" rows="5" required></textarea>
      <button type="submit">Publicar</button>
    </form>
    <p id="post-status" class="success"></p>
  </section>

  <section id="news-list-section" class="fade-in">
    <h2>Últimas Notícias</h2>
    <div id="news-list" class="news-grid">
      <p>Carregando notícias...</p>
    </div>
  </section>

</main>

<script src="/script.js"></script>
</body>
</html>
