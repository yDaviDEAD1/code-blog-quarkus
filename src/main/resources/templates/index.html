<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{title}</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<header>
  <h1>Meu Blog Básico em Quarkus</h1>
</header>

<main>

  <section id="auth-section" class="fade-in">
    <h2>Acesso</h2>

    <div id="logged-out-view">
      <form id="loginForm" class="smooth-card">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="senha" placeholder="Senha" required>
        <button type="submit">Entrar</button>
      </form>
      <p id="auth-status" class="error"></p>
    </div>

    <div id="logged-in-view" style="display: none;" class="fade-in">
      <p>Bem-vindo(a), <strong id="username-display"></strong> <span class="role-tag" id="role-display"></span></p>
      <button id="logoutButton">Sair</button>
    </div>
  </section>

  <section id="post-creation-section" style="display: none;" class="fade-in">
    <h2>Nova Notícia</h2>
    <form id="postForm" class="smooth-card">
      <input type="text" id="post-title" placeholder="Título da Notícia" required>
      <textarea id="post-content" placeholder="Conteúdo da notícia" rows="5" required></textarea>
      <button type="submit">Publicar</button>
    </form>
    <p id="post-status" class="success"></p>
  </section>

  <section id="news-list-section" class="fade-in">
    <h2>Últimas Notícias</h2>
    <div id="news-list" class="news-grid">
      <p>Carregando notícias...</p>
    </div>
  </section>

</main>

<script src="/script.js"></script>
</body>
</html>
